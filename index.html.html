<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEAQ Telecommunication - Realtime Project Tracker</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-overlay: rgba(15, 23, 42, 0.85);
      --panel-bg: rgba(30, 41, 59, 0.75);
      --panel-border: rgba(255, 255, 255, 0.12);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      
      /* Dynamic status colors */
      --status-not-started-bg: rgba(100, 116, 139, 0.25);
      --status-not-started-border: rgba(148, 163, 184, 0.3);
      --status-not-started-text: #94a3b8;
      
      --status-in-progress-bg: rgba(245, 158, 11, 0.2);
      --status-in-progress-border: rgba(245, 158, 11, 0.5);
      --status-in-progress-text: #fef08a;

      --status-completed-bg: rgba(16, 185, 129, 0.2);
      --status-completed-border: rgba(16, 185, 129, 0.5);
      --status-completed-text: #86efac;

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(var(--bg-overlay), var(--bg-overlay)),
                  radial-gradient(circle at center, #4a5568 0%, #1a202c 70%, #0f172a 100%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
    }

    .app { display: flex; height: 100vh; overflow: hidden; }

    .sidebar {
      width: 330px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--panel-border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--panel-border);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .project-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
    }

    .project-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }

    .project-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .project-item.active {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.4), rgba(29, 78, 216, 0.5));
      border-color: rgba(96, 165, 250, 0.5);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .project-name { font-size: 15px; font-weight: 700; }

    .status-badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid;
      white-space: nowrap;
    }

    .status-badge.not-started {
      background: var(--status-not-started-bg);
      border-color: var(--status-not-started-border);
      color: var(--status-not-started-text);
    }

    .status-badge.in-progress {
      background: var(--status-in-progress-bg);
      border-color: var(--status-in-progress-border);
      color: var(--status-in-progress-text);
    }

    .status-badge.completed {
      background: var(--status-completed-bg);
      border-color: var(--status-completed-border);
      color: var(--status-completed-text);
    }

    .main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.4); }

    .input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      outline: none;
      font-size: 14px;
    }
    .input:focus { border-color: #60a5fa; }

    .system-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      transition: all 0.3s ease;
    }

    .system-card.in-progress {
      border-color: var(--status-in-progress-border);
      background: rgba(245, 158, 11, 0.05);
    }

    .system-card.completed {
      border-color: var(--status-completed-border);
      background: rgba(16, 185, 129, 0.05);
    }

    .system-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .system-title { font-size: 18px; font-weight: 700; }

    .task-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .task-left { display: flex; align-items: center; gap: 10px; flex: 1; }
    .checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #10b981; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">SEAQ <span>TELECOM</span></div>
        <div class="sync-badge">
          <div class="sync-dot"></div> Realtime
        </div>
      </div>
      <ul id="projectList" class="project-list"></ul>
      <div style="margin-top: 16px; display: flex; gap: 8px;">
        <input id="newProjectInput" class="input" style="flex:1" placeholder="New Project ID (e.g., NB969)" />
        <button id="addProjectBtn" class="btn btn-primary">+ Create</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar glass-panel">
        <h1 id="selectedProjectTitle" style="margin:0; font-size: 24px;">Loading...</h1>
        <button id="deleteProjectBtn" class="btn btn-danger">Delete Project</button>
      </div>

      <div id="systemsContainer" class="glass-panel"></div>
    </main>
  </div>

  <script>
    // Standard Telecommunication Systems for Tier 2
    const DEFAULT_SYSTEMS = [
      "41702 - Master Clock",
      "42508 - Automatic Telephone System",
      "42502 - SCCS",
      "42510 - PA & GA",
      "42800 - CCTV",
      "54600 - Entertainment, TVRO and Reception System",
      "85500 - LAN_WLAN",
      "85502 - Rack & Infrastructure"
    ];

    // Standard Checklist Tasks for Tier 3 in English
    const DEFAULT_TASKS = [
      "Installation & Wiring Check",
      "Pre-Commissioning Test Run",
      "Completion, Show HAT & Handover"
    ];

    let projects = JSON.parse(localStorage.getItem('seaq_projects_en')) || [
      {
        id: 'nb968',
        name: 'NB968',
        systems: DEFAULT_SYSTEMS.map(sys => ({
          name: sys,
          tasks: DEFAULT_TASKS.map(t => ({ title: t, completed: false }))
        }))
      }
    ];

    let activeProjectId = projects[0]?.id || 'nb968';

    function saveAndRender() {
      localStorage.setItem('seaq_projects_en', JSON.stringify(projects));
      render();
    }

    function getSystemStatus(system) {
      const total = system.tasks.length;
      if (total === 0) return 'not-started';
      const completed = system.tasks.filter(t => t.completed).length;
      if (completed === 0) return 'not-started';
      if (completed === total) return 'completed';
      return 'in-progress';
    }

    function render() {
      // Sidebar Projects
      const projectListEl = document.getElementById('projectList');
      projectListEl.innerHTML = '';

      projects.forEach(p => {
        let totalTasks = 0, completedTasks = 0;
        p.systems.forEach(s => {
          totalTasks += s.tasks.length;
          completedTasks += s.tasks.filter(t => t.completed).length;
        });

        let statusClass = 'not-started';
        let statusText = 'Not Started';
        if (completedTasks > 0 && completedTasks < totalTasks) {
          statusClass = 'in-progress';
          statusText = 'In Progress';
        } else if (totalTasks > 0 && completedTasks === totalTasks) {
          statusClass = 'completed';
          statusText = 'Completed';
        }

        const li = document.createElement('li');
        li.className = `project-item ${p.id === activeProjectId ? 'active' : ''}`;
        li.onclick = () => { activeProjectId = p.id; render(); };
        li.innerHTML = `
          <span class="project-name">${p.name}</span>
          <span class="status-badge ${statusClass}">${statusText}</span>
        `;
        projectListEl.appendChild(li);
      });

      // Active Project View
      const activeProject = projects.find(p => p.id === activeProjectId);
      if (!activeProject) return;

      document.getElementById('selectedProjectTitle').innerText = `Project: ${activeProject.name}`;

      const container = document.getElementById('systemsContainer');
      container.innerHTML = '';

      activeProject.systems.forEach((sys, sysIdx) => {
        const sysStatus = getSystemStatus(sys);
        let sysStatusText = sysStatus === 'completed' ? 'Completed' : (sysStatus === 'in-progress' ? 'In Progress' : 'Not Started');

        const card = document.createElement('div');
        card.className = `system-card ${sysStatus}`;
        
        let tasksHTML = sys.tasks.map((t, taskIdx) => `
          <li class="task-item">
            <div class="task-left">
              <input type="checkbox" class="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${activeProject.id}', ${sysIdx}, ${taskIdx})">
              <span style="${t.completed ? 'text-decoration: line-through; opacity: 0.6;' : ''}">${t.title}</span>
            </div>
          </li>
        `).join('');

        card.innerHTML = `
          <div class="system-header">
            <div class="system-title">${sys.name}</div>
            <span class="status-badge ${sysStatus}">${sysStatusText}</span>
          </div>
          <ul class="task-list">${tasksHTML}</ul>
        `;
        container.appendChild(card);
      });
    }

    function toggleTask(projId, sysIdx, taskIdx) {
      const proj = projects.find(p => p.id === projId);
      if (proj) {
        proj.systems[sysIdx].tasks[taskIdx].completed = !proj.systems[sysIdx].tasks[taskIdx].completed;
        saveAndRender();
      }
    }

    document.getElementById('addProjectBtn').onclick = () => {
      const input = document.getElementById('newProjectInput');
      const name = input.value.trim();
      if (!name) return alert('Please enter a project ID!');

      const newProj = {
        id: 'proj_' + Date.now(),
        name: name,
        systems: DEFAULT_SYSTEMS.map(sys => ({
          name: sys,
          tasks: DEFAULT_TASKS.map(t => ({ title: t, completed: false }))
        }))
      };

      projects.push(newProj);
      activeProjectId = newProj.id;
      input.value = '';
      saveAndRender();
    };

    document.getElementById('deleteProjectBtn').onclick = () => {
      if (projects.length <= 1) return alert('Cannot delete all projects!');
      if (confirm('Are you sure you want to delete this project?')) {
        projects = projects.filter(p => p.id !== activeProjectId);
        activeProjectId = projects[0].id;
        saveAndRender();
      }
    };

    render();
  </script>
</body>
</html>
